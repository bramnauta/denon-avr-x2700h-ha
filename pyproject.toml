[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Same import style as Home Assistant core.
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["homeassistant", "denon_pkg"]
