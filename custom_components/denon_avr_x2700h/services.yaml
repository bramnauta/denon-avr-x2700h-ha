send_command:
  target:
    entity:
      integration: denon_avr_x2700h
      domain: media_player
  fields:
    command:
      required: true
      example: "PSDYNEQ ON"
      selector:
        text:
          multiple: true
    wait:
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: s

save_quick_select:
  target:
    entity:
      integration: denon_avr_x2700h
      domain: media_player
  fields:
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 4
          mode: box

set_tuner_frequency:
  target:
    entity:
      integration: denon_avr_x2700h
      domain: media_player
  fields:
    frequency:
      required: true
      example: 101.2
      selector:
        number:
          min: 0.1
          max: 1800
          step: 0.05
          mode: box

refresh:
  target:
    entity:
      integration: denon_avr_x2700h
      domain: media_player
